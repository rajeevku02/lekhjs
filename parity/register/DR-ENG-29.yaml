id: DR-ENG-29
title: 'Drawing a connector does not rewrite its stored style or its arrowheads'
area: ENG
kind: bug-fix
cpp: 'ConnectionObject::draw called drawingProfile.setNoFill() and IArrowObject::drawArrows restyled the stored arrowhead templates from the connector (stroke paint and width, no dash, a filled head filled with the stroke colour over white), so a board saved after a draw carried fillpaint {type: 1} on every connector and restyled arrowhead styles, and one saved without a draw (kashi, the Node oracle) did not'
