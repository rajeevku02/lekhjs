id: DR-EXP-03
title: 'SVG export honours clip, translate and save/restore'
area: EXP
kind: bug-fix
cpp: 'L/SVGExporter.cpp SVGDrawingPlatform left saveContext, restoreContext, translate and clip empty: the SVG drew clipped content unclipped and translated content untranslated, and its elements sat directly under the root'
ts: 'export/svg/svg-drawing-platform.ts: saveContext/restoreContext open and close a <g>; translate opens a <g transform="translate(x y)"> and clip a <g clip-path="url(#…)"> after its <clipPath>, each closed by the matching restoreContext. BoardSession.drawForExport wraps every page paint in one saveContext/restoreContext pair, so every exported SVG page holds its elements in one outer <g>; the element coordinates are unchanged (applyExportView offsets them, as C++ TranslatedDrawingPlatform did, AC-EXP-29) and the rendered image is the same for content that issues no clip or translate'
