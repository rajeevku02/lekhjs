id: DR-UI-03
title: 'The board chrome is drawn with DOM, CSS and SVG, not canvases: frame borders and labels are within a pixel of C++, not pixel-identical'
area: UI
kind: intended-change
cpp: 'The C++ canvas UI (lib:: widgets, WidgetObject::drawBorder) painted every tool bar, popover, menu, list row, label, switch and preview on the UI canvas; the TS port until 2026-10-22 matched it pixel for pixel by giving each frame, label, switch, arrow preview and library cell a canvas of its own (AC-UI-18: under 0.1 % differing pixels per screen)'
ts: 'lekhboard-capacitor board UI: frames are CSS borders and a blurred ::before shadow from the same tokens and placement, labels visible DOM text (sans-serif, 1em lines, centred), switches CSS, arrowhead previews SVG images drawn by the engine on SvgDrawingPlatform, library cells images of thumbnails drawn on one shared canvas. Borders snap to whole pixels and text sits about half a pixel lower, so screens differ from the C++ web build by 0.1-1.1 % of their pixels; only the three board layers are canvases'
