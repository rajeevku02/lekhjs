id: DR-ENG-26
title: 'Geometry is computed in doubles, not float32'
area: ENG
kind: bug-fix
cpp: 'number_t is float (lekhcore/src/base/TypeDefinitions.h): group member rects derived on load from the stored factors, polygon centres and nested rotations are computed in float32, so they carry the rounding of the absolute coordinates involved (e.g. a 40.4321 wide member of a nested group near 12,000 is written 40.4318)'
ts: 'Plain doubles throughout (spec 03, no Math.fround): the same geometry agrees with C++ only to the float32 and six-digit rounding of the coordinates, which the value-relative tolerance does not absorb when the result is small next to them'
user_visible: false
fixture: parity/fixtures/DR-ENG-26/group-nested.lekh
rule:
  json:
    - path: '/pages/*/objects/*'
      op: normalise
      normaliser: geometry-precision
    - path: '/pages/*/objects/**/template'
      op: normalise
      normaliser: six-digit-data
  # Ties the float32 and the double coordinate resolve to different pixel rows:
  # - half_pixel_edge: an unrotated image whose edge lies on a pixel's centre line of the export
  #   (k + 0.5: the 20 px padding and the half stroke put the edge of an image that bounds the page
  #   there): a one-pixel line along that edge;
  # - text_row_shift: a single-line text whose glyphs land one whole row apart (Chromium places
  #   glyphs on whole rows; the baseline is on a row's centre line): the text's rectangle matches
  #   exactly once the TS image is moved by one row;
  # - object_flag route-tie: a stored orthogonal route whose end legs leave the same way between
  #   two shapes whose sides facing that way are level: LineGenerator's parallel case compares the
  #   two ends along that direction (isAhead), a tie, and takes the other end's step.
  image:
    attribute: { object_flag: route-tie, half_pixel_edge: image, text_row_shift: true }
  perf: null
evidence: 'spec 03 (plain doubles); D2 corpus run: member and polygon cx/cy/width/height/angle differences within 2e-5 of the coordinate magnitudes, and native-generator data expressions (avabodh.table.std) whose six-digit literals differ by one unit in the last digit (unit test in parity/test/json.test.mjs); member angles 2π apart where atan2 lands on the other side of its branch cut; P1 over the 10,003-board corpus (2026-10-18): 1,796 applications per pass; image (B), W11-FX: an image bounding the page draws its edge row on one build only (fixture parity/fixtures/DR-ENG-26/image-half-pixel-edge.lekh: a 224 x 1 px line, C++ edge from float32 cy/height, TS from doubles), and a single-line text drawn one row apart (both builds draw it with textBaseline top at the box centre less half the line height, the same formula; the corpus line matches exactly after a one-row move), and a stored orthogonal route between two shapes with level left sides takes the step of the target end on C++ and of the source end on TS (fixture parity/fixtures/DR-ENG-26/route-tie.lekh: the vertical leg 40 vs 94 pt from the sides); unit tests in parity/test/image.test.mjs'
