  perf: null
evidence: 'W11-FX image triage (verification 02 §B): in the fixture the connectors to ellipses turned by 1.5e-7, 0.3 and 1.5708 rad end beside the outline, off the line of centres and not at all on the C++ web build, the one to the unrotated ellipse matches; three corpus pages of the G2 sample; flag unit test in parity/test/image.test.mjs'
