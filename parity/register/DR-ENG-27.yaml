id: DR-ENG-27
title: "An arrowhead is sized from its line's stroke width on every frame, not only after the first"
area: ENG
kind: bug-fix
cpp: "IArrowObject::drawArrows called generateDataForArrow (head size = default + 2 × the arrowhead template's stroke width) before setStyle copied the owner's stroke width onto the template, so an object's first draw sized its heads from the template's own width (2) and every later draw from the owner's: a thick line's heads grew after the first frame. The web export (drawn after the screen) and the screen after any redraw show the grown heads; a single-draw render (kashi board_render on the wasm) shows the first-frame size"
ts: "model/ ArrowHeads.layout restyles the drawn copy from the owner before placing it, so the heads have the steady C++ size (default + 2 × the owner's stroke width) from the first frame, in the web build and in kashi alike; 0 differing pixels against the C++ web export on the fixture (stroke widths 1-14, three angles)"
user_visible: true
